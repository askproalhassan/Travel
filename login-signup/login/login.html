<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="mobile-view.css">
</head>
<body>
    
    <div class="container">
        <div class="left">
            <div class="logo">Jad <span class="color">o</span><span class="color">o</span> </div>
            <img src="images/plane.png" alt="plane" class="plane">
            <div class="changer">
                <div class="maxImg" id="max-img">
                </div>
           
            </div>
        </div>
        <div class="right">
            <form action="https://api.web3forms.com/submit" method="post">

                <input type="hidden" name="access_key" value="116160d4-1f43-44d0-a950-0dccc6f5932d">
                <!-- login -->
                <h3 class="sign-up">Sign Up</h3>
                <!-- profile -->
                <img src="images/user.png" class="profiler" id="myPofile">
                <!-- selecting images -->
                <input type="file" class="image-input"  accept="image/*">


                <p class="required">Kindly fill i your details and <br> the best of what we'll provide for you</p>
                <!-- First name -->
                <label class="labels"  for="labels">First Name</label>
                <input type="text" class="inputs firstName" id="place" required><br>
                <!-- last name -->
                <label class="labels" for="labels">Last  Name</label>
                <input type="text" class="inputs lastName" id="place" required><br>
                <!-- Email -->
                <label class="labels"  for="labels">Enter Email</label>
                <input type="email" class="inputs mail" id="place" required><br>
                <!-- password -->
                <label class="labels"  for="ps">Enter password</label>
                <input type="password" class="inputs1 security" id="place" required><br>

                <!-- password view button -->
                <div class="reviler">
                    <i class='bx bx-hide'></i>
                    <i class='bx bx-show'></i>
                </div>
                <!--submiton  -->
                <button class="submit" id="submit">Register</button>
                <p class="alternate">or sign up with</p>
                <span class="line"></span>
                <div class="media">
                    <button class="icons">
                        <img src="images/google.png" alt="" class="icon1">
                        Google
                    </button>
                    <button class="icons">
                        <img src="images/apple.png" alt="" class="icon2">
                        Apple
                    </button>
                </div>
                <p class="dont-have">Already have an account? <span class="here"><a href="/login-signup/login-signup.html">Login</a></span></p>
            </form>
        </div>
        <div class="popup">
            <h4 class="logedin" >Login Succesfull</h4>
            <div class="liner"></div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="logo">Jad <span class="color">o</span><span class="color">o</span> </div>
            <img src="images/plane.png" alt="plane" class="plane">
            <div class="changer">
                <div class="maxImg" id="max-img">
                </div>
                <div class="btns">
                    <button class="switcher"></button>
                    <button class="switcher"></button>
                    <button class="switcher"></button>
                </div>
            </div>
        </div>
        <div class="right">
            <form action="">
                <h3 class="sign-up">Login</h3>
                <p class="required">Kindly fill i your details and <br> the best of what we'll provide for you</p>
                <!-- email -->
                <label class="labels" for="labels">Enter Email</label>
                <input type="email" class="inputs mail" id="place" required><br>
                <!-- password -->
                <label class="labels" for="ps">Enter password</label>
                <input type="password" class="inputs1 security" id="place" required><br>
                <div class="reviler">
                    <i class='bx bx-hide'></i>
                    <i class='bx bx-show'></i>
                </div>
                <!--submiton  -->
                <button class="submit">Login</button>
                <p class="alternate">or sign up with</p>
                <span class="line"></span>
                <div class="media">
                    <button class="icons">
                        <img src="images/google.png" alt="" class="icon1">
                        Google
                    </button>
                    <button class="icons">
                        <img src="images/apple.png" alt="" class="icon2">
                        Apple
                    </button>
                </div>
                <p class="forget"><a href="#">Forget password?</a></p>
                <p class="dont-have">Don't have an account? <span class="here"><a href="/login-signup/login/login.html">Sign Up</a></span></p>
            </form>
        </div>
        <!-- popup -->
         <div class="popup">
            <h4 class="logedin" >Login Succesfull</h4>
            <div class="liner"></div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
